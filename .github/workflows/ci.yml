name: CI
on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Domain, use-case, HTTP, contract and architecture tests
        run: python -m pytest

  integration:
    # The real engine with the schema of qone-billing-db (Annex C). The schema is cloned from the
    # sibling repository; while its develop has no migrations yet, the job reports it and skips.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_DB: billing
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U billing -d billing" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Fetch the schema of qone-billing-db
        run: git clone --depth 1 --branch ${BILLING_DB_REF:-develop} https://github.com/code-corhuila/qone-billing-db.git /tmp/billing-db
      - name: Migrate and run the integration tests
        run: |
          if [ ! -d /tmp/billing-db/migrations ]; then
            echo "::notice::qone-billing-db has no migrations on ${BILLING_DB_REF:-develop} yet; integration tests skipped"
            exit 0
          fi
          docker run --rm --network host -v /tmp/billing-db:/workspace flyway/flyway:10.22.0 \
            -workingDirectory=/workspace -configFiles=/workspace/flyway.toml \
            -url=jdbc:postgresql://localhost:5432/billing -user=billing -password=billing migrate
          TEST_DATABASE_URL=postgresql://billing:billing@localhost:5432/billing python -m pytest tests/test_postgres_integration.py -v

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t qone-billing-api:ci .
      - name: Run it with a throwaway key and the in-memory store, then smoke-check it
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out /tmp/jwt-private.pem 2>/dev/null
          openssl pkey -in /tmp/jwt-private.pem -pubout -out /tmp/jwt-public.pem
          docker run -d --rm --name billing-ci -p 8005:8000 -e JWT_PUBLIC_KEY="$(awk 'NF {printf "%s\\n", $0}' /tmp/jwt-public.pem)" qone-billing-api:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8005/api/v1/billing/health && break; sleep 1; done
          sh deploy/smoke.sh http://localhost:8005
          docker stop billing-ci
