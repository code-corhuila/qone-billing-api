# The billing service as qone-infra composes it (Annex G): expose only, reachable on the
# platform network through the gateway; it starts after its database is healthy and after the
# migrations ran (`run --rm billing-db-migrate` from qone-infra). Every value comes from .env.
services:
  qone-billing-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: qone-billing-api:${IMAGE_TAG:-dev}
    container_name: qone-billing-api
    restart: unless-stopped
    environment:
      BILLING_DATABASE_URL: postgresql://${BILLING_DB_USER:-billing}:${BILLING_DB_PASSWORD:?BILLING_DB_PASSWORD is required}@billing-db:5432/${BILLING_DB_NAME:-billing}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      CURRENT_TERM: ${CURRENT_TERM:-2026-B}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    expose:
      - "8000"
    depends_on:
      billing-db:
        condition: service_healthy
    networks:
      - platform
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/billing/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  platform:
    external: true
